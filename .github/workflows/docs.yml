name: Docs links

on:
  push:
    paths: ['**/*.md', '.github/workflows/docs.yml']
  pull_request:
    paths: ['**/*.md', '.github/workflows/docs.yml']

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check relative links in Markdown
        shell: python
        run: |
          import pathlib, re, sys
          broken = []
          for md in pathlib.Path('.').rglob('*.md'):
              for target in re.findall(r'\]\(([^)\s]+)\)', md.read_text(encoding='utf-8')):
                  path = target.split('#')[0]
                  if path and not re.match(r'^[a-z]+:', path) and not (md.parent / path).exists():
                      broken.append(f'{md}: {target}')
          print('\n'.join(broken) or 'All relative links resolve.')
          sys.exit(1 if broken else 0)
